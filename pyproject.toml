[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fuelcore"
version = "0.1.0"
requires-python = ">=3.8"

[project.optional-dependencies]
mysql = ["PyMySQL>=1.0.2,<2"]
report = ["Pillow>=10,<14", "reportlab>=4,<5", "pypdfium2>=4,<6", "openpyxl>=3.1,<4"]

[tool.setuptools.package-data]
fuelcore = ["schema.csv"]

[tool.setuptools]
packages = ["fuelcore", "fuelcore.edi", "fuelcore.report"]
