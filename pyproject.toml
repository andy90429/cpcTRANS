[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fuelcore"
version = "0.1.0"
requires-python = ">=3.8"

[project.optional-dependencies]
mysql = ["PyMySQL>=1.0.2,<2"]

[tool.setuptools.package-data]
fuelcore = ["schema.csv"]

[tool.setuptools]
packages = ["fuelcore", "fuelcore.edi"]
